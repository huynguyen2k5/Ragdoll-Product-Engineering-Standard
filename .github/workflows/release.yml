name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match pyproject version {expected!r}")
          PY

      - name: Validate release source
        run: |
          python scripts/validate_skill_pack.py
          python scripts/validate_project_context.py .
          python -m unittest discover -s tests -v
          python -m compileall -q ragdoll scripts tools tests
          sh -n install.sh
          sh -n uninstall.sh

      - name: Build verified installer release assets
        run: python scripts/build_release.py --output dist

      - name: Verify generated checksum
        run: sha256sum --check dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
